<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antrean QC — UltimateCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<body>

  <header class="topbar">
    <a class="brandmark" href="index.html">

      <span class="role-chip">QC Reviewer</span>

  <div class="wrap" id="listView">
    <h1 class="page-title">Antrean Review QC</h1>

    <div class="card" style="padding:0; overflow:hidden;">
      <table class="list" id="visitTable">
        <thead>
          <tr><th>Site</th><th>Shopper</th><th>Tanggal</th><th>Skor</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="visitTbody"></tbody>
      </table>
    </div>
  </div>

  <div class="wrap" id="detailView" style="display:none;"></div>

<script src="data.js"></script>
